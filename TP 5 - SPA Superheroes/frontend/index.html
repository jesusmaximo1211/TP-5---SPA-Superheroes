<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Inter:wght@400;700&display=swap"
        rel="stylesheet">
    <title>Superheroes Comic App</title>
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --comic-red: #E60000;
            --comic-blue: #0080FF;
            --comic-bg: #1a1a1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--comic-bg);
            background-image:
                radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px;
            color: white;
            overflow-x: hidden;
        }

        .comic-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        .comic-button-font {
            font-family: 'Luckiest Guy', cursive;
        }

        .comic-panel {
            border: 4px solid black;
            box-shadow: 8px 8px 0px 0px rgba(0, 0, 0, 1);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            background: #222;
        }

        .comic-panel:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px 0px rgba(0, 0, 0, 1);
            border-color: var(--comic-yellow);
        }

        .comic-title {
            text-shadow: 3px 3px 0px #000;
            -webkit-text-stroke: 1px black;
        }

        .comic-header {
            background: var(--comic-yellow);
            color: black;
            border: 4px solid black;
            transform: skew(-5deg);
            padding: 1rem 2rem;
            display: inline-block;
            box-shadow: 8px 8px 0px 0px var(--comic-red);
        }

        .filter-btn {
            border: 3px solid black;
            box-shadow: 4px 4px 0px 0px black;
            transition: all 0.1s;
        }

        .filter-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0px 0px black;
        }

        .filter-btn.active {
            background-color: var(--comic-yellow) !important;
            color: black !important;
        }

        .badge-dc {
            background-color: var(--comic-blue);
            transform: rotate(-2deg);
        }

        .badge-marvel {
            background-color: var(--comic-red);
            transform: rotate(2deg);
        }

        /* Halftone overlay effect */
        .halftone {
            position: relative;
        }

        .halftone::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#000 10%, transparent 11%);
            background-size: 5px 5px;
            opacity: 0.1;
            pointer-events: none;
        }

        .action-burst {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--comic-yellow);
            color: black;
            padding: 5px 10px;
            font-family: 'Bangers', cursive;
            border: 2px solid black;
            transform: rotate(15deg);
            z-index: 10;
        }

        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        .carousel-img {
            display: none;
        }
        .carousel-img.active {
            display: block;
        }

        /* Toast Styles */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border: 4px solid black;
            box-shadow: 6px 6px 0px 0px black;
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast-success { background-color: #4ADE80; color: black; }
        .toast-error { background-color: var(--comic-red); color: white; }
    </style>
</head>

<body class="min-h-screen pb-12">
    <!-- Toasts -->
    <div id="toast" class="toast comic-button-font text-xl uppercase">Mensaje</div>

    <!-- MAIN CONTAINER -->
    <div class="container mx-auto px-4 pt-12">
        <header class="text-center mb-10">
            <div class="comic-header mb-6">
                <h1 class="text-6xl md:text-8xl comic-font uppercase italic comic-title">
                    SUPERHEROES SPA
                </h1>
            </div>
            <p class="text-2xl comic-button-font text-white uppercase tracking-widest mt-4">
                Práctica #6 - <span class="text-yellow-400">Bases de Datos NoSQL JESUS SERRA</span>
            </p>
        </header>

        <!-- FILTERS AND SEARCH -->
        <div class="flex flex-col md:flex-row gap-6 mb-12 justify-between items-center bg-zinc-800 p-8 border-4 border-black shadow-[8px_8px_0px_0px_rgba(255,222,0,1)]">
            <div class="flex flex-wrap gap-4 justify-center">
                <a href="#/" id="btn-todos"
                    class="filter-btn px-6 py-3 bg-zinc-700 text-white comic-button-font text-xl rounded-none uppercase transition">
                    TODOS
                </a>
                <a href="#/dc" id="btn-dc"
                    class="filter-btn px-6 py-3 bg-blue-700 text-white comic-button-font text-xl rounded-none uppercase transition">
                    DC COMICS
                </a>
                <a href="#/marvel" id="btn-marvel"
                    class="filter-btn px-6 py-3 bg-red-700 text-white comic-button-font text-xl rounded-none uppercase transition">
                    MARVEL
                </a>
            </div>
            <div class="flex gap-4 w-full md:w-auto">
                <div class="relative flex-1 md:w-64">
                    <input type="text" id="searchInput" onkeyup="filterHeroes()" placeholder="BUSCAR HÉROE..."
                        class="w-full p-4 bg-white text-black border-4 border-black comic-button-font text-xl focus:outline-none focus:bg-yellow-100 placeholder-zinc-500">
                    <div class="absolute -bottom-2 -right-2 w-full h-full border-4 border-black bg-black -z-10"></div>
                </div>
                <button onclick="openFormModal()" class="filter-btn bg-green-500 text-black comic-button-font px-4 text-2xl border-4 border-black hover:bg-green-400">
                    + AÑADIR
                </button>
            </div>
        </div>

        <!-- GRID -->
        <div id="heroesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10">
            <!-- Los héroes se cargarán aquí -->
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="detailModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-800 border-4 border-black w-full max-w-4xl max-h-[90vh] overflow-y-auto comic-panel shadow-[16px_16px_0px_0px_rgba(255,222,0,1)]">
            <div class="flex justify-between items-center p-4 border-b-4 border-black bg-zinc-900">
                <h2 id="detailTitle" class="text-4xl comic-font text-white uppercase comic-title">Detalle</h2>
                <button onclick="closeModal('detailModal')" class="text-3xl text-red-500 hover:text-red-400 font-bold px-2">&times;</button>
            </div>
            
            <div class="p-6 md:p-8 flex flex-col md:flex-row gap-8">
                <!-- Carousel Container -->
                <div class="w-full md:w-1/2 flex flex-col">
                    <div class="relative border-4 border-black bg-white halftone h-80 flex items-center justify-center overflow-hidden mb-4" id="carouselContainer">
                        <!-- Images will be injected here -->
                    </div>
                    <div class="flex justify-between items-center bg-zinc-900 border-4 border-black p-2">
                        <button onclick="prevImage()" class="px-4 py-2 bg-yellow-400 text-black comic-button-font border-2 border-black hover:bg-yellow-300">&lt; PREV</button>
                        <span id="carouselCounter" class="comic-font text-xl">1 / 1</span>
                        <button onclick="nextImage()" class="px-4 py-2 bg-yellow-400 text-black comic-button-font border-2 border-black hover:bg-yellow-300">NEXT &gt;</button>
                    </div>
                </div>

                <!-- Info Container -->
                <div class="w-full md:w-1/2 flex flex-col gap-4">
                    <div class="flex items-center justify-between">
                        <div id="detailBadge" class="inline-block px-4 py-2 border-2 border-black text-sm comic-button-font uppercase">
                            Publisher
                        </div>
                        <div id="detailLogo" class="text-3xl comic-font italic"></div>
                    </div>

                    <div class="bg-zinc-900 border-2 border-zinc-700 p-4 mt-2">
                        <p class="mb-2"><span class="text-yellow-400 comic-button-font text-sm uppercase">Nombre Real:</span> <span id="detailAlterEgo" class="font-bold text-lg"></span></p>
                        <p class="mb-2"><span class="text-yellow-400 comic-button-font text-sm uppercase">Año de Aparición:</span> <span id="detailYear" class="font-bold text-lg"></span></p>
                        <p class="mb-2"><span class="text-yellow-400 comic-button-font text-sm uppercase">Primera Aparición:</span> <span id="detailFirstApp" class="font-bold text-lg"></span></p>
                        <p class="mb-2"><span class="text-yellow-400 comic-button-font text-sm uppercase">Equipamiento:</span> <span id="detailEquipment" class="font-bold text-lg"></span></p>
                    </div>

                    <div class="mt-2">
                        <h4 class="text-yellow-400 comic-button-font text-lg uppercase mb-2">BIOGRAFÍA:</h4>
                        <p id="detailBio" class="text-zinc-300 leading-relaxed"></p>
                    </div>

                    <div class="mt-auto pt-6 flex gap-4">
                        <button id="btnEdit" class="flex-1 py-3 bg-blue-500 text-white border-4 border-black comic-button-font text-xl hover:bg-blue-400 transition-colors uppercase">
                            EDITAR
                        </button>
                        <button id="btnDelete" class="flex-1 py-3 bg-red-600 text-white border-4 border-black comic-button-font text-xl hover:bg-red-500 transition-colors uppercase">
                            ELIMINAR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FORM MODAL (CREATE/EDIT) -->
    <div id="formModal" class="fixed inset-0 modal-overlay hidden z-50 flex items-center justify-center p-4">
        <div class="bg-zinc-800 border-4 border-black w-full max-w-2xl max-h-[90vh] overflow-y-auto comic-panel shadow-[16px_16px_0px_0px_rgba(255,222,0,1)]">
            <div class="flex justify-between items-center p-4 border-b-4 border-black bg-zinc-900">
                <h2 id="formTitle" class="text-4xl comic-font text-white uppercase comic-title">AÑADIR HÉROE</h2>
                <button onclick="closeModal('formModal')" class="text-3xl text-red-500 hover:text-red-400 font-bold px-2">&times;</button>
            </div>
            <div class="p-6">
                <form id="heroForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="formId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Nombre (Superhéroe)*</label>
                            <input type="text" id="formSuperhero" required class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                        </div>
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Nombre Real (Alter Ego)</label>
                            <input type="text" id="formAlterEgo" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                        </div>
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Casa (Publisher)*</label>
                            <select id="formPublisher" required class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                                <option value="Marvel Comics">Marvel Comics</option>
                                <option value="DC Comics">DC Comics</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Año de Aparición</label>
                            <input type="number" id="formYear" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                        </div>
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Primera Aparición</label>
                            <input type="text" id="formFirstApp" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                        </div>
                        <div>
                            <label class="block text-yellow-400 comic-button-font mb-1">Equipamiento</label>
                            <input type="text" id="formEquipment" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                        </div>
                    </div>
                    <div>
                        <label class="block text-yellow-400 comic-button-font mb-1">Biografía</label>
                        <textarea id="formBio" rows="3" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100"></textarea>
                    </div>
                    <div>
                        <label class="block text-yellow-400 comic-button-font mb-1">URL Avatar (Principal)*</label>
                        <input type="url" id="formAvatar" required class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                    </div>
                    <div>
                        <label class="block text-yellow-400 comic-button-font mb-1">URLs Imágenes Extra (Separadas por comas)</label>
                        <input type="text" id="formImages" class="w-full p-2 text-black border-2 border-black focus:outline-none focus:bg-yellow-100">
                    </div>
                    
                    <div class="pt-4 border-t-2 border-zinc-700 flex justify-end gap-4">
                        <button type="button" onclick="closeModal('formModal')" class="py-2 px-6 bg-zinc-600 text-white border-4 border-black comic-button-font text-lg hover:bg-zinc-500 uppercase">CANCELAR</button>
                        <button type="submit" class="py-2 px-6 bg-green-500 text-black border-4 border-black comic-button-font text-lg hover:bg-green-400 uppercase">GUARDAR ¡POW!</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/heroes';
        let allHeroes = [];
        let currentRoute = '#/';
        let currentDetailHero = null;
        let currentImageIndex = 0;

        // Routing
        window.addEventListener('hashchange', handleRoute);
        
        async function init() {
            await fetchHeroesData();
            handleRoute();
        }

        function handleRoute() {
            currentRoute = window.location.hash || '#/';
            
            // Update buttons
            document.querySelectorAll('a.filter-btn').forEach(btn => btn.classList.remove('active'));
            if(currentRoute === '#/dc') document.getElementById('btn-dc').classList.add('active');
            else if(currentRoute === '#/marvel') document.getElementById('btn-marvel').classList.add('active');
            else document.getElementById('btn-todos').classList.add('active');

            filterHeroes();
        }

        async function fetchHeroesData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error en red');
                allHeroes = await response.json();
            } catch (error) {
                console.error("Error cargando héroes:", error);
                showToast("¡CRASH! Error al cargar datos", "error");
            }
        }

        function filterHeroes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allHeroes;

            // Route filter
            if (currentRoute === '#/dc') filtered = filtered.filter(h => h.publisher === 'DC Comics');
            else if (currentRoute === '#/marvel') filtered = filtered.filter(h => h.publisher === 'Marvel Comics');

            // Search filter
            if (query) {
                filtered = filtered.filter(h => 
                    h.superhero.toLowerCase().includes(query) || 
                    (h.alter_ego && h.alter_ego.toLowerCase().includes(query))
                );
            }

            renderHeroes(filtered);
        }

        function truncateString(str, num) {
            if (!str) return "Sin biografía.";
            if (str.length <= num) return str;
            return str.slice(0, num) + '...';
        }

        function renderHeroes(heroes) {
            const grid = document.getElementById('heroesGrid');
            if (heroes.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-3xl comic-font py-20">¡NO SE ENCONTRARON HÉROES!</p>';
                return;
            }

            grid.innerHTML = heroes.map((hero, index) => {
                const isMarvel = hero.publisher === 'Marvel Comics';
                const badgeClass = isMarvel ? 'badge-marvel' : 'badge-dc';
                const bioTruncated = truncateString(hero.bio, 80);
                
                return `
                <div class="comic-panel group cursor-pointer" onclick="openDetailModal('${hero._id}')">
                    <div class="action-burst text-sm">#${index + 1}</div>
                    
                    <div class="h-64 overflow-hidden bg-white halftone flex items-center justify-center p-6 border-b-4 border-black relative">
                        <img src="${hero.avatar_url || 'https://via.placeholder.com/300x400?text=NO+IMAGE'}" alt="${hero.superhero}" 
                            class="h-full object-contain group-hover:scale-110 transition-transform duration-500 z-10"
                            onerror="this.src='https://via.placeholder.com/300x400?text=SUPERHERO'">
                    </div>
                    
                    <div class="p-6 bg-zinc-800 flex flex-col h-full">
                        <div class="mb-4">
                            <h3 class="text-3xl comic-font uppercase text-white comic-title leading-tight">${hero.superhero}</h3>
                        </div>
                        
                        <div class="inline-block px-3 py-1 mb-4 border-2 border-black text-xs comic-button-font uppercase w-max ${badgeClass}">
                            ${hero.publisher}
                        </div>
                        
                        <div class="space-y-2 text-sm border-t-2 border-zinc-700 pt-4 flex-grow">
                            <p class="flex flex-col">
                                <span class="text-yellow-400 text-xs comic-button-font uppercase">ALTER EGO:</span>
                                <span class="font-bold text-lg truncate">${hero.alter_ego || '-'}</span>
                            </p>
                            <p class="text-zinc-300 italic text-sm mt-2 line-clamp-3">${bioTruncated}</p>
                        </div>
                        
                        <button class="w-full mt-4 py-3 bg-white text-black border-4 border-black comic-button-font text-lg hover:bg-yellow-400 transition-colors uppercase">
                            VER FICHA
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Modals logic
        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        async function openDetailModal(id) {
            const hero = allHeroes.find(h => h._id === id);
            if (!hero) return;
            currentDetailHero = hero;

            document.getElementById('detailTitle').textContent = hero.superhero;
            document.getElementById('detailAlterEgo').textContent = hero.alter_ego || '-';
            document.getElementById('detailYear').textContent = hero.year || '-';
            document.getElementById('detailFirstApp').textContent = hero.first_appearance || '-';
            document.getElementById('detailEquipment').textContent = hero.equipment || 'Ninguno';
            document.getElementById('detailBio').textContent = hero.bio || 'Sin biografía disponible.';
            
            const badgeClass = hero.publisher === 'Marvel Comics' ? 'badge-marvel' : 'badge-dc';
            const badgeEl = document.getElementById('detailBadge');
            badgeEl.className = `inline-block px-4 py-2 border-2 border-black text-sm comic-button-font uppercase ${badgeClass}`;
            badgeEl.textContent = hero.publisher;

            const logoEl = document.getElementById('detailLogo');
            logoEl.textContent = hero.publisher === 'Marvel Comics' ? 'MARVEL' : 'DC';
            logoEl.className = `text-3xl comic-font italic ${hero.publisher === 'Marvel Comics' ? 'text-red-500' : 'text-blue-500'} comic-title`;

            // Setup Carousel
            setupCarousel(hero);

            // Setup action buttons
            document.getElementById('btnEdit').onclick = () => openFormModal(hero);
            document.getElementById('btnDelete').onclick = () => deleteHero(hero._id);

            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Carousel Logic
        function setupCarousel(hero) {
            currentImageIndex = 0;
            const container = document.getElementById('carouselContainer');
            let images = [];
            
            if (hero.images && hero.images.length > 0) {
                images = hero.images;
            } else {
                images = [hero.avatar_url || 'https://via.placeholder.com/300x400?text=NO+IMAGE'];
            }

            container.innerHTML = images.map((img, idx) => `
                <img src="${img}" class="carousel-img ${idx === 0 ? 'active' : ''} h-full object-contain absolute p-4 z-10" onerror="this.src='https://via.placeholder.com/300x400?text=ERROR'">
            `).join('');

            updateCarouselCounter(images.length);
        }

        function updateCarouselCounter(total) {
            document.getElementById('carouselCounter').textContent = `${currentImageIndex + 1} / ${total}`;
        }

        function changeImage(step) {
            if(!currentDetailHero) return;
            const images = currentDetailHero.images && currentDetailHero.images.length > 0 ? currentDetailHero.images : [currentDetailHero.avatar_url];
            const total = images.length;
            if(total <= 1) return;

            const imgElements = document.querySelectorAll('.carousel-img');
            imgElements[currentImageIndex].classList.remove('active');
            
            currentImageIndex = (currentImageIndex + step + total) % total;
            
            imgElements[currentImageIndex].classList.add('active');
            updateCarouselCounter(total);
        }

        function prevImage() { changeImage(-1); }
        function nextImage() { changeImage(1); }

        // CRUD Logic
        function openFormModal(hero = null) {
            if(hero && hero._id) closeModal('detailModal'); // Close detail if coming from edit
            
            document.getElementById('formTitle').textContent = hero ? 'EDITAR HÉROE' : 'AÑADIR HÉROE';
            document.getElementById('formId').value = hero ? hero._id : '';
            document.getElementById('formSuperhero').value = hero ? hero.superhero : '';
            document.getElementById('formAlterEgo').value = hero ? hero.alter_ego : '';
            document.getElementById('formPublisher').value = hero ? hero.publisher : 'Marvel Comics';
            document.getElementById('formYear').value = hero ? hero.year : '';
            document.getElementById('formFirstApp').value = hero ? hero.first_appearance : '';
            document.getElementById('formEquipment').value = hero ? hero.equipment : '';
            document.getElementById('formBio').value = hero ? hero.bio : '';
            document.getElementById('formAvatar').value = hero ? hero.avatar_url : '';
            document.getElementById('formImages').value = hero && hero.images ? hero.images.join(',') : '';

            document.getElementById('formModal').classList.remove('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('formId').value;
            const imagesStr = document.getElementById('formImages').value;
            const imagesArr = imagesStr ? imagesStr.split(',').map(i => i.trim()).filter(i => i) : [];
            
            // Si el arreglo de imagenes está vacío, usamos al menos el avatar
            if (imagesArr.length === 0) {
                 imagesArr.push(document.getElementById('formAvatar').value);
            }

            const heroData = {
                superhero: document.getElementById('formSuperhero').value,
                alter_ego: document.getElementById('formAlterEgo').value,
                publisher: document.getElementById('formPublisher').value,
                year: document.getElementById('formYear').value,
                first_appearance: document.getElementById('formFirstApp').value,
                equipment: document.getElementById('formEquipment').value,
                bio: document.getElementById('formBio').value,
                avatar_url: document.getElementById('formAvatar').value,
                images: imagesArr
            };

            try {
                let response;
                if (id) {
                    // Update
                    response = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(heroData)
                    });
                } else {
                    // Create
                    response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(heroData)
                    });
                }

                if (!response.ok) throw new Error('Error al guardar');
                
                await fetchHeroesData();
                filterHeroes();
                closeModal('formModal');
                showToast(`¡BAM! Héroe ${id ? 'actualizado' : 'creado'} con éxito`, 'success');

            } catch (error) {
                console.error(error);
                showToast(`¡CRASH! Error al guardar`, 'error');
            }
        }

        async function deleteHero(id) {
            if (!confirm('¿Estás seguro de eliminar este héroe? ¡ZAP!')) return;
            
            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('Error al eliminar');
                
                await fetchHeroesData();
                closeModal('detailModal');
                filterHeroes();
                showToast('¡KABOOM! Héroe eliminado', 'success');
            } catch (error) {
                console.error(error);
                showToast('¡CRASH! Error al eliminar', 'error');
            }
        }

        // Toasts
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show comic-button-font text-xl uppercase`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Inicializar
        init();
    </script>
</body>

</html>
